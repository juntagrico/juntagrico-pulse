name: juntagrico-ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, 'releases/**' ]

jobs:
  check-dependencies:
    name: Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: |
          uv pip install --system -e . --group dev
          uv pip install --system deptry

      - name: Run deptry
        run: deptry . --github-output

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Ruff check
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          args: check --preview

  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DJANGO_SETTINGS_MODULE: dev.settings
      PYTHONPATH: .
      COVERAGE_FILE: coverage
    strategy:
      matrix:
        include:
          - python-version: '3.10'
          - python-version: '3.11'
          - python-version: '3.12'
          - python-version: '3.13'
          - python-version: '3.14'

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up uv and python
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: install dependencies
      run: |
        uv pip install --system -e . --group dev

    - name: make migrations
      run: python -m django makemigrations --check --dry-run

    - name: run tests
      run: python -m manage test
      if: ${{ matrix.python-version  != '3.11' }}

    - name: run tests with coverage
      run: coverage run -m manage test
      if: ${{ matrix.python-version  == '3.11' }}

    - run: coverage lcov -o coverage.lcov
      if: ${{ matrix.python-version  == '3.11' }}

    - uses: actions/upload-artifact@v7
      if: ${{ matrix.python-version  == '3.11' }}
      with:
        name: coverage
        path: coverage.lcov

  coverage:
    name: Coverage Report
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          path: coverage
          merge-multiple: true
      - uses: qltysh/qlty-action/coverage@ebcd284bf32e36a030afe15f1e136c7be08b9506
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage/coverage*.lcov
